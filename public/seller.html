<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sotuvchi paneli — Marketplace</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/panel.css">
  <style>
    :root { --accent: #2563eb; --accent-soft: #eff6ff;
      --side-bg: var(--surface); --side-text: var(--muted); --side-strong: var(--text); --side-line: var(--line); --side-hover: var(--surface-2); --side-active: var(--accent-soft); }
    @media (prefers-color-scheme: dark) { :root { --accent: #3b82f6; --accent-soft: rgba(59,130,246,.16); } }
    .side-nav a.active { color: var(--accent); }
    .orders { display: grid; gap: 14px; }
    .order { padding: 18px 20px; display: grid; gap: 12px; }
    .order .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .order .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; font-size: 14px; }
    .order .meta div span { display: block; font-size: 12px; color: var(--muted); }
    .items { display: grid; gap: 6px; padding: 12px 14px; background: var(--surface-2); border-radius: 10px; font-size: 14px; }
    .items div { display: flex; justify-content: space-between; gap: 10px; }
    .order .bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .order .total { font-size: 18px; font-weight: 700; }
    .callout { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 12px; background: var(--accent-soft); color: var(--text); margin-bottom: 18px; font-size: 14px; }
    .prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
    .prod { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .prod h3 { font-size: 15px; }
    .prod .row { display: flex; justify-content: space-between; align-items: center; }
    .prod .price { font-weight: 700; font-size: 16px; }
    .prod .acts { display: flex; gap: 6px; margin-top: 4px; }
    .prod .acts .btn { flex: 1; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><div class="logo">🏪</div><div><span id="shop-name">Do'konim</span><small>Sotuvchi paneli</small></div></div>
      <nav class="side-nav">
        <a href="#home" data-nav="home"><span class="i">🏠</span><span class="t">Bosh sahifa</span></a>
        <a href="#products" data-nav="products"><span class="i">📦</span><span class="t">Mahsulotlarim</span></a>
        <a href="#orders" data-nav="orders"><span class="i">🧾</span><span class="t">Buyurtmalar</span><span class="n" id="new-count" hidden></span></a>
      </nav>
      <div class="side-foot">
        <div class="avatar" id="me-av"></div>
        <div class="who"><b id="me-name"></b><span id="me-phone"></span></div>
        <button class="icon-btn" data-act="logout" title="Chiqish"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <script src="/js/core.js"></script>
  <script src="/js/seller.js"></script>
</body>
</html>
