<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin paneli — Marketplace</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/panel.css">
  <style>
    :root { --accent: #7c3aed; --accent-soft: #f3e8ff;
      --side-bg: #0f172a; --side-text: #94a3b8; --side-strong: #f8fafc; --side-line: #1e293b; --side-hover: #1e293b; --side-active: #312e81; }
    @media (prefers-color-scheme: dark) { :root { --accent-soft: rgba(124,58,237,.18); --side-bg: #0a0d14; } }
    .roles-bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; margin: 14px 0 12px; background: var(--surface-2); }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    .grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.8fr); gap: 16px; margin-top: 16px; }
    @media (max-width: 1100px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }
    .role-select { width: auto; padding: 6px 10px; font-size: 13px; font-weight: 600; border-radius: 99px; }
    .r-admin { color: #7c3aed; } .r-seller { color: #2563eb; } .r-courier { color: #ea580c; } .r-user { color: #059669; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><div class="logo">👑</div><div><span>Marketplace</span><small>Admin paneli</small></div></div>
      <nav class="side-nav">
        <a href="#dashboard" data-nav="dashboard"><span class="i">📊</span><span class="t">Boshqaruv</span></a>
        <a href="#users" data-nav="users"><span class="i">👥</span><span class="t">Foydalanuvchilar</span></a>
        <a href="#products" data-nav="products"><span class="i">📦</span><span class="t">Mahsulotlar</span></a>
        <a href="#orders" data-nav="orders"><span class="i">🧾</span><span class="t">Buyurtmalar</span></a>
      </nav>
      <div class="side-foot">
        <div class="avatar" id="me-av"></div>
        <div class="who"><b id="me-name"></b><span id="me-phone"></span></div>
        <button class="icon-btn" data-act="logout" title="Chiqish"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <script src="/js/core.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
