<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kuryer — Marketplace</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    :root { --accent: #ea580c; --accent-soft: #fff7ed; }
    @media (prefers-color-scheme: dark) { :root { --accent: #f97316; --accent-soft: rgba(249,115,22,.15); } }
    body { background: var(--bg); }
    .app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .bar { padding: 20px 16px 72px; color: #fff; background: linear-gradient(140deg, #f97316, #c2410c); border-radius: 0 0 28px 28px; }
    .bar .row { display: flex; align-items: center; gap: 12px; }
    .bar .av { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; background: rgba(255,255,255,.2); }
    .bar .who { flex: 1; }
    .bar .who b { display: block; font-size: 17px; }
    .bar .who span { font-size: 13px; opacity: .85; display: inline-flex; align-items: center; gap: 6px; }
    .bar .who span::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,.3); }
    .bar .out { background: rgba(255,255,255,.18); color: #fff; border: 0; }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: -52px 16px 0; }
    .kpi { padding: 14px; text-align: center; }
    .kpi b { display: block; font-size: 22px; }
    .kpi span { font-size: 12px; color: var(--muted); }
    .tabs { position: sticky; top: 0; z-index: 5; padding: 16px 16px 10px; background: var(--bg); }
    .tabs .segments { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; }
    .list { padding: 4px 16px 40px; display: grid; gap: 14px; }
    .job { padding: 16px; display: grid; gap: 14px; }
    .job .top { display: flex; justify-content: space-between; align-items: center; }
    .job .price { font-size: 20px; font-weight: 800; }
    .route { display: grid; grid-template-columns: 22px 1fr; column-gap: 10px; row-gap: 14px; position: relative; }
    .route::before { content: ''; position: absolute; left: 10px; top: 14px; bottom: 14px; border-left: 2px dashed var(--line); }
    .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; color: #fff; z-index: 1; }
    .dot.a { background: #2563eb; } .dot.b { background: var(--accent); }
    .route small { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
    .route a { color: var(--text); font-weight: 500; }
    .goods { font-size: 14px; color: var(--muted); padding: 10px 12px; background: var(--surface-2); border-radius: 10px; }
    .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .acts .btn { padding: 13px; border-radius: 12px; font-size: 15px; }
    .acts .full { grid-column: 1 / -1; }
    .refresh { font-size: 12px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="row">
        <div class="av" id="av"></div>
        <div class="who"><b id="name"></b><span>Ishdaman</span></div>
        <button class="btn sm out" data-act="logout">Chiqish</button>
      </div>
    </header>
    <div class="kpis">
      <div class="card kpi"><b id="k-new">0</b><span>Yangi zakaz</span></div>
      <div class="card kpi"><b id="k-active">0</b><span>Faol</span></div>
      <div class="card kpi"><b id="k-done">0</b><span>Yetkazilgan</span></div>
    </div>
    <div class="tabs"><div class="segments">
      <button data-act="tab" data-tab="new" class="active">Yangi</button>
      <button data-act="tab" data-tab="active">Faol</button>
      <button data-act="tab" data-tab="done">Tarix</button>
    </div></div>
    <div class="list" id="list"></div>
  </div>

  <script src="/js/core.js"></script>
  <script>
    const { api, esc, money, badge, when, run } = MP;
    let tab = 'new', data = { available: [], mine: [] };

    function job(o) {
      let acts = '';
      if (tab === 'new') acts = `<button class="btn ok full" data-act="accept" data-id="${o.id}">✓ Qabul qilish</button>`;
      if (tab === 'active') acts = `<button class="btn danger" data-act="cancel" data-id="${o.id}">✕ Bekor qilish</button><button class="btn ok" data-act="done" data-id="${o.id}">Yetkazildi</button>`;
      return `<div class="card job">
        <div class="top"><div><b>#${o.id}</b> <span class="muted small">· ${when(o.created_at)}</span></div>${tab === 'new' ? `<span class="price">${money(o.total)}</span>` : badge(o.status)}</div>
        <div class="route">
          <div class="dot a">A</div><div><small>Olib ketish · sotuvchi</small><b>${esc(o.seller_name)}</b><br><a href="tel:${esc(o.seller_phone)}">📞 ${MP.phone(o.seller_phone)}</a></div>
          <div class="dot b">B</div><div><small>Yetkazish · xaridor</small><b>${esc(o.address)}</b><br>${esc(o.buyer_name)} · <a href="tel:${esc(o.buyer_phone)}">📞 ${MP.phone(o.buyer_phone)}</a></div>
        </div>
        <div class="goods">📦 ${o.items.map((i) => `${esc(i.name)} × ${i.qty}`).join(', ')}${tab !== 'new' ? ` · <b>${money(o.total)}</b>` : ''}</div>
        ${acts ? `<div class="acts">${acts}</div>` : ''}
      </div>`;
    }
    function draw() {
      const active = data.mine.filter((o) => o.status === 'accepted');
      const done = data.mine.filter((o) => o.status !== 'accepted');
      document.getElementById('k-new').textContent = data.available.length;
      document.getElementById('k-active').textContent = active.length;
      document.getElementById('k-done').textContent = data.mine.filter((o) => o.status === 'delivered').length;
      document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
      const list = { new: data.available, active, done }[tab];
      const empty = { new: ['📭', "Hozircha yangi zakaz yo'q.<br>Sotuvchilar kuryer qidirganda shu yerda paydo bo'ladi."], active: ['🛵', "Faol zakazingiz yo'q"], done: ['🗂', "Tarix bo'sh"] }[tab];
      document.getElementById('list').innerHTML = list.length
        ? list.map(job).join('') + (tab === 'new' ? '<div class="refresh">Ro\'yxat har 10 soniyada yangilanadi</div>' : '')
        : `<div class="card empty"><span class="big">${empty[0]}</span>${empty[1]}</div>`;
    }
    async function load() {
      [data.available, data.mine] = await Promise.all([api('/courier/available'), api('/courier/mine')]);
      draw();
    }

    MP.actions({
      logout: () => MP.logout(),
      tab: (d) => { tab = d.tab; draw(); },
      accept: (d) => run(() => api(`/courier/orders/${d.id}/accept`, { method: 'POST' }), 'Zakaz qabul qilindi', async () => { tab = 'active'; await load(); }),
      cancel: (d) => MP.confirmBox("Zakazni bekor qilasizmi? U boshqa kuryerlarga qaytadi.") && run(() => api(`/courier/orders/${d.id}/cancel`, { method: 'POST' }), 'Bekor qilindi — zakaz boshqa kuryerlarga qaytdi', load),
      done: (d) => run(() => api(`/courier/orders/${d.id}/delivered`, { method: 'POST' }), 'Yetkazildi! Rahmat 👏', load),
    });

    (async () => {
      const me = await MP.guard('courier');
      document.getElementById('av').textContent = MP.initials(me.name);
      document.getElementById('name').textContent = me.name;
      await load();
      setInterval(() => { if (!document.hidden && !document.querySelector('dialog')) load().catch(() => {}); }, 10000);
    })();
  </script>
</body>
</html>
