<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Do'kon — Marketplace</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    :root { --accent: #059669; --accent-soft: #ecfdf5; }
    @media (prefers-color-scheme: dark) { :root { --accent: #10b981; --accent-soft: rgba(16,185,129,.15); } }
    .top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .top .in { max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; color: var(--text); }
    .logo i { font-style: normal; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: #fff; }
    .search { flex: 1; max-width: 520px; position: relative; }
    .search input { padding-left: 38px; border-radius: 12px; background: var(--surface-2); }
    .search::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: .6; }
    .nav { display: flex; gap: 6px; margin-left: auto; align-items: center; }
    .nav a.btn.active { color: var(--accent); background: var(--accent-soft); }
    .cart-btn { position: relative; }
    .cart-btn .n { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px 64px; }
    .banner { border-radius: 20px; padding: 32px; color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 24px;
      background: radial-gradient(600px 300px at 90% 0%, rgba(255,255,255,.18), transparent 60%), linear-gradient(120deg, #047857, #10b981); }
    .banner h1 { font-size: clamp(22px, 3vw, 32px); }
    .banner p { margin: 6px 0 0; opacity: .85; }
    .banner .big { font-size: 64px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; }
    .chip { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; }
    .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
    .p { padding: 12px; display: flex; flex-direction: column; gap: 6px; transition: transform .15s, box-shadow .15s; }
    .p:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,.1); }
    .p .seller { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 6px; }
    .p h3 { font-size: 15px; font-weight: 600; }
    .p .desc { font-size: 13px; color: var(--muted); flex: 1; }
    .p .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .p .price { font-size: 18px; font-weight: 800; }
    .p .stock { font-size: 12px; color: var(--muted); }
    .add { width: 40px; height: 40px; padding: 0; border-radius: 12px; font-size: 20px; }
    .in-cart { font-size: 12px; color: var(--accent); font-weight: 600; }

    /* Savat */
    .drawer { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: flex-end; background: rgba(10,12,18,.5); }
    .drawer .panel { width: min(440px, 100%); height: 100%; background: var(--surface); display: flex; flex-direction: column; animation: slide .2s ease; }
    @keyframes slide { from { transform: translateX(40px); opacity: 0; } }
    .drawer header { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .drawer .body { flex: 1; overflow-y: auto; padding: 16px 20px; display: grid; gap: 12px; align-content: start; }
    .line { display: flex; gap: 12px; align-items: center; }
    .line .info { flex: 1; min-width: 0; }
    .line .info b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; }
    .qty button { width: 30px; height: 30px; border: 0; background: transparent; color: var(--text); font-size: 16px; cursor: pointer; }
    .qty span { min-width: 24px; text-align: center; font-weight: 600; font-size: 14px; }
    .drawer footer { padding: 16px 20px 20px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
    .sum { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; }

    /* Buyurtmalar */
    .orders { display: grid; gap: 14px; max-width: 820px; }
    .order { padding: 20px; display: grid; gap: 14px; }
    .order .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .step { font-size: 12px; color: var(--muted); font-weight: 500; }
    .step::before { content: ''; display: block; height: 6px; border-radius: 99px; background: var(--line); margin-bottom: 8px; }
    .step.done { color: var(--text); }
    .step.done::before { background: var(--accent); }
    .order .it { font-size: 14px; color: var(--muted); }
    .order .ft { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

    @media (max-width: 720px) {
      .top .in { flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
      .search { order: 3; flex-basis: 100%; max-width: none; }
      .nav .label { display: none; }
      .wrap { padding: 16px 16px 48px; }
      .banner { padding: 22px; } .banner .big { display: none; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .p .desc { display: none; }
      .steps { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header class="top"><div class="in">
    <a class="logo" href="#shop"><i>🛍</i>Marketplace</a>
    <form class="search" id="search"><input type="search" name="q" placeholder="Mahsulot qidirish..."></form>
    <nav class="nav">
      <a class="btn ghost" href="#shop" data-nav="shop">🏬 <span class="label">Do'kon</span></a>
      <a class="btn ghost" href="#orders" data-nav="orders">🧾 <span class="label">Buyurtmalarim</span></a>
      <button class="btn cart-btn" data-act="open-cart">🛒 <span class="label">Savat</span><span class="n" id="cart-n" hidden></span></button>
      <button class="btn ghost" data-act="logout" title="Chiqish"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg><span class="label">Chiqish</span></button>
    </nav>
  </div></header>
  <main class="wrap" id="main"></main>
  <div class="drawer" id="drawer" hidden></div>

  <script src="/js/core.js"></script>
  <script src="/js/shop.js"></script>
</body>
</html>
